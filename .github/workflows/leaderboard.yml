name: Update leaderboard block

# Keeps the "Latest numbers" table in the profile README in step with the
# published turkish-speech-bench results.

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/scripts/update_leaderboard.py
      - name: Commit if the numbers changed
        run: |
          if git diff --quiet README.md; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh leaderboard numbers" README.md
          git push
